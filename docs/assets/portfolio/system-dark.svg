<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="664" viewBox="0 0 1200 664" role="img" aria-labelledby="title desc"><title id="title">CarVisionAI system diagram</title><desc id="desc">Implementation-oriented diagram; arrows identify information flow. See adjacent README text for accessible explanation and limitations.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#a5b8bf"/></marker></defs><rect width="1200" height="664" rx="12" fill="#101b22"/><text x="35" y="42" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#74ced2" font-weight="700">01 / ROBOTICS + PERCEPTION / SYSTEM MAP</text><text x="35" y="77" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#f2f1e9" font-weight="700">Module boundaries and the simulated feedback loop</text><rect x="35" y="102" width="330" height="110" rx="9" fill="#15252e" stroke="#344b55"/><rect x="35" y="120" width="4" height="74" fill="#74ced2"/><text x="57" y="136" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#f2f1e9" font-weight="700">Sensor adapters</text><text x="57" y="167" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#a5b8bf" >Stereo disparity / ToF returns</text><text x="57" y="191" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#a5b8bf" >Synthetic or recorded inputs</text><rect x="435" y="102" width="330" height="110" rx="9" fill="#15252e" stroke="#344b55"/><rect x="435" y="120" width="4" height="74" fill="#74ced2"/><text x="457" y="136" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#f2f1e9" font-weight="700">Metric geometry</text><text x="457" y="167" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#a5b8bf" >Explicit rigid transforms</text><text x="457" y="191" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#a5b8bf" >Vehicle x-right / y-forward</text><rect x="835" y="102" width="330" height="110" rx="9" fill="#15252e" stroke="#344b55"/><rect x="835" y="120" width="4" height="74" fill="#74ced2"/><text x="857" y="136" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#f2f1e9" font-weight="700">Occupancy grid</text><text x="857" y="167" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#a5b8bf" >Unknown · free · occupied</text><text x="857" y="191" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#a5b8bf" >Sensor-independent contract</text><path d="M370 157H428" fill="none" stroke="#a5b8bf" stroke-width="2" marker-end="url(#arrow)" /><path d="M770 157H828" fill="none" stroke="#a5b8bf" stroke-width="2" marker-end="url(#arrow)" /><path d="M1000 217V242H200V265" fill="none" stroke="#a5b8bf" stroke-width="2" marker-end="url(#arrow)" /><rect x="35" y="270" width="330" height="110" rx="9" fill="#15252e" stroke="#344b55"/><rect x="35" y="288" width="4" height="74" fill="#74ced2"/><text x="57" y="304" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#f2f1e9" font-weight="700">Temporal map state</text><text x="57" y="335" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#a5b8bf" >Persistent changes + relevance</text><text x="57" y="359" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#a5b8bf" >Stop / selective replan events</text><rect x="435" y="270" width="330" height="110" rx="9" fill="#15252e" stroke="#344b55"/><rect x="435" y="288" width="4" height="74" fill="#74ced2"/><text x="457" y="304" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#f2f1e9" font-weight="700">Local planning</text><text x="457" y="335" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#a5b8bf" >Inflated footprint + A*</text><text x="457" y="359" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#a5b8bf" >Scored alternative routes</text><rect x="835" y="270" width="330" height="110" rx="9" fill="#15252e" stroke="#344b55"/><rect x="835" y="288" width="4" height="74" fill="#74ced2"/><text x="857" y="304" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#f2f1e9" font-weight="700">Trajectory generation</text><text x="857" y="335" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#a5b8bf" >Checked smoothing</text><text x="857" y="359" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#a5b8bf" >Curvature + braking limits</text><path d="M370 325H428" fill="none" stroke="#a5b8bf" stroke-width="2" marker-end="url(#arrow)" /><path d="M770 325H828" fill="none" stroke="#a5b8bf" stroke-width="2" marker-end="url(#arrow)" /><path d="M1000 385V410H600V433" fill="none" stroke="#a5b8bf" stroke-width="2" marker-end="url(#arrow)" /><rect x="35" y="438" width="330" height="110" rx="9" fill="#15252e" stroke="#344b55"/><rect x="35" y="456" width="4" height="74" fill="#74ced2"/><text x="57" y="472" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#f2f1e9" font-weight="700">Pose estimation</text><text x="57" y="503" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#a5b8bf" >Wheel / IMU / pose inputs</text><text x="57" y="527" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#a5b8bf" >State, uncertainty, health</text><rect x="435" y="438" width="330" height="110" rx="9" fill="#15252e" stroke="#344b55"/><rect x="435" y="456" width="4" height="74" fill="#74ced2"/><text x="457" y="472" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#f2f1e9" font-weight="700">Trajectory follower</text><text x="457" y="503" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#a5b8bf" >Pose feedback + pure pursuit</text><text x="457" y="527" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#a5b8bf" >Commands + explicit faults</text><rect x="835" y="438" width="330" height="110" rx="9" fill="#15252e" stroke="#344b55"/><rect x="835" y="456" width="4" height="74" fill="#74ced2"/><text x="857" y="472" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#f2f1e9" font-weight="700">Simulated motion</text><text x="857" y="503" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#a5b8bf" >Differential-drive model</text><text x="857" y="527" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#a5b8bf" >Encoders + synthetic sensors</text><path d="M370 493H428" fill="none" stroke="#a5b8bf" stroke-width="2" marker-end="url(#arrow)" /><path d="M770 493H828" fill="none" stroke="#a5b8bf" stroke-width="2" marker-end="url(#arrow)" /><path d="M1000 553V591H200V555" fill="none" stroke="#a5b8bf" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="427" y="584" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#a5b8bf" >Timestamped sensor feedback</text><text x="35" y="634" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#a5b8bf" >Demonstrations connect subsets of these modules. No physical driving validation is implied.</text></svg>
